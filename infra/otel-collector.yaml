# The OpenTelemetry Collector between Shelfsense's processes and the backends (docs/adr/0022). Everything arrives
# over OTLP. Traces go two ways: every span into the span_metrics connector (per-route rate, errors and duration,
# so metrics stay complete), and tail-sampled traces into Jaeger. Metrics go to Prometheus, logs to Loki.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}

connectors:
  span_metrics:
    # Prometheus: traces_span_metrics_calls_total and traces_span_metrics_duration_milliseconds_*.
    dimensions:
      - {name: http.route}
      - {name: shelfsense.parse_source}
    histogram:
      explicit: {buckets: [10ms, 25ms, 50ms, 100ms, 150ms, 250ms, 500ms, 1s, 2s, 5s, 15s, 60s]}
    exemplars: {enabled: true}

processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256}
  batch: {}
  # Keep every trace with an error, a DLQ send, a degraded query parse, or a search slower than 1 s, and a share
  # of the rest (5% unless TRACE_SAMPLE_PERCENT says otherwise). decision_wait covers an enrich message: up to 50
  # products, each with a model call. Spans arriving after the decision follow it (decision_cache).
  tail_sampling:
    decision_wait: 60s
    num_traces: 20000
    decision_cache: {sampled_cache_size: 100000, non_sampled_cache_size: 100000}
    policies:
      - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
      - {name: dlq-sends, type: boolean_attribute, boolean_attribute: {key: shelfsense.dlq, value: true}}
      - name: degraded-parses
        type: string_attribute
        string_attribute: {key: shelfsense.parse_source, values: [degraded]}
      - name: slow-searches
        type: and
        and:
          and_sub_policy:
            - {name: over-1s, type: latency, latency: {threshold_ms: 1000}}
            - {name: a-search, type: string_attribute, string_attribute: {key: shelfsense.page, values: [first, next]}}
      - name: share-of-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT:-5}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls: {insecure: true}
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls: {insecure: true}

service:
  pipelines:
    traces/metrics: {receivers: [otlp], processors: [memory_limiter], exporters: [span_metrics]}
    traces/sampled: {receivers: [otlp], processors: [memory_limiter, tail_sampling, batch], exporters: [otlp_grpc/jaeger]}
    metrics: {receivers: [otlp, span_metrics], processors: [memory_limiter, batch], exporters: [otlp_http/prometheus]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/loki]}
