services:
  postgres:
    # Postgres 18 with pgvector 0.8.7 (docs/adr/0001).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: shelfsense
      POSTGRES_PASSWORD: shelfsense
      POSTGRES_DB: shelfsense
    ports:
      - "5436:5432"  # 5434 is Ledgerline's Postgres, 5435 Pagerwise's
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/; mount the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfsense -d shelfsense"]
      interval: 2s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # Local development only: no TLS, no auth (docs/adr/0004). Never expose this port beyond localhost.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9201:9200"  # 9200 left free for other local projects
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s"]
      interval: 5s
      timeout: 5s
      retries: 30

  floci:
    # Local SQS and S3 (docs/adr/0008). LocalStack needs an account token since 2026.03; Floci doesn't.
    image: floci/floci:2.3.0
    environment:
      # Queues, messages and uploaded feeds survive a container restart.
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - flocidata:/app/data

  redis:
    # Query-parse cache (docs/adr/0014). Nothing is persisted: a lost cache only costs model calls.
    image: redis:8.6.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6380:6379"  # 6379 is Pagerwise's Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Observability (docs/adr/0022), only with --profile observability. Processes on the host send OTLP to the
  # collector (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4328), which tail-samples traces into Jaeger, writes
  # metrics to Prometheus and logs to Loki. Ports are offset: Ledgerline's stack holds 4318, 16686, 9090 and 3001.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      TRACE_SAMPLE_PERCENT: ${TRACE_SAMPLE_PERCENT:-5}
    ports:
      - "127.0.0.1:4328:4318"
    depends_on: [jaeger, prometheus, loki]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16687:16686"  # UI and the query API scripts/trace_tree.py reads

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver",
              "--enable-feature=exemplar-storage", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9092:9090"

  loki:
    image: grafana/loki:3.7.9
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # development only: no login to look at the dashboards
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3022:3000"
    depends_on: [prometheus, loki, jaeger]

volumes:
  pgdata:
  osdata:
  flocidata:
  prometheusdata:
  lokidata:
