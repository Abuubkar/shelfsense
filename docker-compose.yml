services:
  postgres:
    # Postgres 18 with pgvector 0.8.7 (docs/adr/0001).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: shelfsense
      POSTGRES_PASSWORD: shelfsense
      POSTGRES_DB: shelfsense
    ports:
      - "5436:5432"  # 5434 is Ledgerline's Postgres, 5435 Pagerwise's
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/; mount the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfsense -d shelfsense"]
      interval: 2s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # Local development only: no TLS, no auth (docs/adr/0004). Never expose this port beyond localhost.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9201:9200"  # 9200 left free for other local projects
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s"]
      interval: 5s
      timeout: 5s
      retries: 30

  floci:
    # Local SQS and S3 (docs/adr/0008). LocalStack needs an account token since 2026.03; Floci doesn't.
    image: floci/floci:2.3.0
    environment:
      # Queues, messages and uploaded feeds survive a container restart.
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - flocidata:/app/data

volumes:
  pgdata:
  osdata:
  flocidata:
