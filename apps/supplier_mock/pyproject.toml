[project]
name = "shelfsense-supplier-mock"
version = "0.1.0"
description = "A supplier's product API, as badly behaved as real ones: offset pages that drift, 429s, outages"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.162.0", "uvicorn>=0.54.0"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
