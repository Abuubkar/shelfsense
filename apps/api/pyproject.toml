[project]
name = "shelfsense-api"
version = "0.1.0"
description = "Shelfsense HTTP API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "ollama>=0.6.3",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
