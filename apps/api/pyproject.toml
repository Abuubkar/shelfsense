[project]
name = "shelfsense-api"
version = "0.1.0"
description = "Shelfsense HTTP API"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "opensearch-py[async]>=3.2.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-aiohttp-client==0.66b2",
    "opentelemetry-instrumentation-botocore==0.66b2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-redis==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "strawberry-graphql>=0.339.1",
    "structlog==26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
