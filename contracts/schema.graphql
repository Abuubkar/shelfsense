type Attribute {
  name: String!
  value: String!
}

"""A product's category in one taxonomy release, and how it was decided."""
type Category {
  taxonomyVersion: String!
  nodeId: Int
  fullPath: String
  confidence: Float!
  model: String!
  promptVersion: String!
}

type Facet {
  name: String!
  values: [FacetValue!]!
}

type FacetValue {
  value: String!
  label: String!
  count: Int!
}

"""
An amount as an integer count of the currency's minor unit, plus its ISO 4217 code.
"""
type Money {
  amountMinor: Int!
  currency: String!
}

"""Information to aid in pagination."""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: String

  """When paginating forwards, the cursor to continue."""
  endCursor: String
}

type Product {
  id: UUID!
  supplier: String!
  supplierSku: String!
  title: String!
  description: String
  brand: String
  gtin: String
  price: Money!
  attributes: [Attribute!]!
  category: Category
}

type ProductConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [ProductEdge!]!
}

"""An edge in a connection."""
type ProductEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: Product!
}

type Query {
  product(id: UUID!): Product

  """Products, oldest first."""
  products(first: Int! = 25, after: String = null, supplier: String = null, categoryId: Int = null): ProductConnection!

  """Faceted hybrid search; the same results and order as GET /v1/search."""
  search(query: String! = "", filters: SearchFilters = null, first: Int! = 24, after: String = null, debug: Boolean! = false): SearchConnection!
}

type Score {
  stage: String!
  value: Float!
}

type SearchConnection {
  """Pagination data for this connection"""
  pageInfo: PageInfo!

  """Contains the nodes in this connection"""
  edges: [SearchResultEdge!]!
  total: Int!
  facets: [Facet!]!
}

"""Facet filters: values within one field are OR'ed, fields are AND'ed."""
input SearchFilters {
  brand: [String!]! = []
  color: [String!]! = []
  categoryId: [Int!]! = []

  """Inclusive, in minor units."""
  priceMin: Int = null

  """Inclusive, in minor units."""
  priceMax: Int = null
}

"""
One search result. `scores` is empty unless the search asked for debug.
"""
type SearchResult {
  id: UUID!
  rank: Int!
  title: String!
  brand: String
  price: Money!
  color: String
  size: String
  categoryId: Int
  categoryPath: String
  stage: String
  scores: [Score!]!
}

"""An edge in a connection."""
type SearchResultEdge {
  """A cursor for use in pagination"""
  cursor: String!

  """The item at the end of the edge"""
  node: SearchResult!
}

scalar UUID
