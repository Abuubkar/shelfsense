[project]
name = "shelfsense"
version = "0.1.0"
description = "Workspace root: dev tooling and scripts. App code lives in apps/."
requires-python = ">=3.13"
dependencies = ["shelfsense-api", "shelfsense-worker-enrich", "shelfsense-worker-index"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker_enrich", "apps/worker_index", "packages/clients/python"]

[tool.uv.sources]
shelfsense-api = { workspace = true }
shelfsense-client = { workspace = true }
shelfsense-worker-enrich = { workspace = true }
shelfsense-worker-index = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
markers = ["integration: needs Docker (testcontainers); run with make test-int"]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "openapi-python-client>=0.29.1",
    "pytest>=9.2.0",
    "shelfsense-client",
    "testcontainers>=4.15.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# Generated by openapi-python-client (make codegen); never edited by hand.
extend-exclude = ["packages/clients/python"]

[tool.ruff.lint]
# Ruff's defaults (pyflakes and the pycodestyle errors) plus import order and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shelfsense_api", "shelfsense_client", "shelfsense_worker_enrich", "shelfsense_worker_index"]
