[project]
name = "shelfsense"
version = "0.1.0"
description = "Workspace root: dev tooling and scripts. App code lives in apps/."
requires-python = ">=3.13"
dependencies = ["shelfsense-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
shelfsense-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Ruff's defaults (pyflakes and the pycodestyle errors) plus import order and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["shelfsense_api"]
